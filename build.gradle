plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
}

apply from: "lint.gradle"

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'
    runtimeOnly group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.12'
    implementation group: 'com.zaxxer', name: 'HikariCP', version: '6.2.1'
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.7'

    implementation group: 'org.springframework.boot', name: 'spring-boot-starter', version: '3.4.0'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: '3.4.0'
    implementation group: 'org.springframework.boot', name: 'spring-boot-configuration-processor', version: '3.4.0'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '3.4.0'
    annotationProcessor group: 'org.springframework.boot', name: 'spring-boot-configuration-processor', version: '3.4.0'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '3.4.0'

    implementation group: 'org.locationtech.jts', name: 'jts-core', version: '1.20.0'

    implementation group: 'org.hibernate.orm', name: 'hibernate-spatial', version: '7.1.0.Final'

    implementation group: 'org.mapstruct', name: 'mapstruct', version: '1.6.3'
    annotationProcessor group: 'org.mapstruct', name: 'mapstruct-processor', version: '1.6.3'
}

